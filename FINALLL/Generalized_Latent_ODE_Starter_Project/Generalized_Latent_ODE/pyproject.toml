[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-latent-ode"
version = "0.1.0"
description = "Cross-family generalization and forecasting in Latent Neural ODEs (adapted re-implementation and experimental extension of Chen et al., 2018)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchdiffeq>=0.2.4",
  "numpy>=1.25",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
